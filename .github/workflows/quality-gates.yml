name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  code-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python scripts/check_architecture.py
      - run: python -m pytest
      - run: npm ci
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customer_agent_integration
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d customer_agent_integration"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports: ["6333:6333", "6334:6334"]
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/customer_agent_integration
      MIGRATION_DATABASE_URL: postgresql+asyncpg://codex_integration_migrator:codex_integration_migrator@127.0.0.1:5432/customer_agent_integration
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/customer_agent_integration
      RLS_DATABASE_URL: postgresql+asyncpg://codex_integration_app:codex_integration_app@127.0.0.1:5432/customer_agent_integration
      TEST_QDRANT_URL: http://127.0.0.1:6333
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      RUN_INTEGRATION_TESTS: "1"
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 120); do
            curl --silent --fail http://127.0.0.1:6333/collections && exit 0
            sleep 1
          done
          exit 1
      - name: Configure migration and restricted RLS roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d customer_agent_integration -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE codex_integration_migrator LOGIN PASSWORD 'codex_integration_migrator' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOINHERIT;"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE codex_integration_app LOGIN PASSWORD 'codex_integration_app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOINHERIT;"
          psql -h 127.0.0.1 -U postgres -d customer_agent_integration -v ON_ERROR_STOP=1 \
            -c "GRANT CONNECT ON DATABASE customer_agent_integration TO codex_integration_migrator;" \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO codex_integration_migrator;" \
            -c "GRANT CONNECT ON DATABASE customer_agent_integration TO codex_integration_app;" \
            -c "GRANT USAGE ON SCHEMA public TO codex_integration_app;"
      - run: python -m alembic upgrade head
        env:
          MIGRATION_DATABASE_URL: postgresql+asyncpg://codex_integration_migrator:codex_integration_migrator@127.0.0.1:5432/customer_agent_integration
      - run: python -m scripts.validate_database_schema
        env:
          MIGRATION_DATABASE_URL: postgresql+asyncpg://codex_integration_migrator:codex_integration_migrator@127.0.0.1:5432/customer_agent_integration
      - name: Verify database is at every migration head
        run: python -m alembic current --check-heads
        env:
          MIGRATION_DATABASE_URL: postgresql+asyncpg://codex_integration_migrator:codex_integration_migrator@127.0.0.1:5432/customer_agent_integration
      - name: Grant application table privileges
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d customer_agent_integration -v ON_ERROR_STOP=1 \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO codex_integration_app;" \
            -c "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO codex_integration_app;" \
            -c "REVOKE INSERT, UPDATE, DELETE ON TABLE platform_site_directory, platform_tenant_entitlements FROM codex_integration_app;" \
            -c "REVOKE ALL ON SEQUENCE platform_site_directory_id_seq FROM codex_integration_app;"
      - run: python -m pytest tests/integration
