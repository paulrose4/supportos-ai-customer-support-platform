services:
  api:
    init: true
    image: ${COMPOSE_PROJECT_NAME:-obsidianragagent}-api
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/customer_agent
      QDRANT_URL: http://qdrant:6333
      BACKUP_STATUS_DIRECTORY: /workspace/backups/status
      LOCAL_EMBEDDING_CACHE_DIR: /home/app/.cache/fastembed
      WEB_SYNC_WORKER_HEARTBEAT_PATH: /workspace/.cache/web-sync-worker/heartbeat
    volumes:
      - .:/workspace
      - fastembed_cache:/home/app/.cache/fastembed
    working_dir: /workspace
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  web-sync-worker:
    init: true
    profiles: ["web-sync"]
    image: ${COMPOSE_PROJECT_NAME:-obsidianragagent}-api
    build: .
    command: python scripts/run_web_sync_worker.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/customer_agent
      QDRANT_URL: http://qdrant:6333
      LOCAL_EMBEDDING_CACHE_DIR: /home/app/.cache/fastembed
      PYTHONPATH: /workspace
      WEB_SYNC_WORKER_HEARTBEAT_PATH: /workspace/.cache/web-sync-worker/heartbeat
    volumes:
      - .:/workspace
      - fastembed_cache:/home/app/.cache/fastembed
    working_dir: /workspace
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from pathlib import Path; import time;
          p=Path('/workspace/.cache/web-sync-worker/heartbeat');
          raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 60 else 1)
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

  tenant-experience-worker:
    init: true
    image: ${COMPOSE_PROJECT_NAME:-obsidianragagent}-api
    build: .
    command: python scripts/run_tenant_experience_worker.py serve
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/customer_agent
      QDRANT_URL: http://qdrant:6333
      LOCAL_EMBEDDING_CACHE_DIR: /home/app/.cache/fastembed
      PYTHONPATH: /workspace
    volumes:
      - .:/workspace
      - fastembed_cache:/home/app/.cache/fastembed
    working_dir: /workspace
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    ports:
      - "8090:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: customer_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r line <&3; [[ "$${line}" == *"200"* ]]'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fastembed_cache:
  postgres_data:
  qdrant_storage:
  redis_data:

